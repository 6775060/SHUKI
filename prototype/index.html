<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>אזור אישי פונטשוק</title>
<style>
@font-face{font-family:"Discovery_Fs";font-weight:100 900;font-style:normal;font-display:swap;src:url("fonts/Discovery_Fs-VF.woff2") format("woff2-variations"),url("fonts/Discovery_Fs-VF.woff2") format("woff2")}
/* Layout: Raizy Silver's personal area (white header, grey ground, one white card = right sidebar + content). Light-only, as in the Figma. Font: Discovery_Fs from fontshok.co.il */
:root{
  color-scheme: light;
  --bg:#F4F4F4; --card:#FFFFFF; --ink:#151515; --muted:#6E6E6E; --faint:#A8A8A8; --line:#E8E8E8; --soft:#F2F2F2; --softer:#F8F7FB;
  --violet:#5B3FFF; --violet-text:#9B4DFF;
  --grad:linear-gradient(90deg,#A29BFE 0%,#E1B6FF 100%);
  --ok:#43D61B; --ok-track:#E2FBD6; --warn:#FFC700; --warn-track:#FFF3C4; --bad:#FF1E1E; --bad-track:#FFD6D6;
  --new:#FF6A3D;
  /* subscription colours (from the logo files) */
  --c-desk:linear-gradient(135deg,#FF9A8B,#E3166F);
  --c-web:linear-gradient(158deg,#6FCFA1,#2C67FF);
  --c-extra:linear-gradient(108deg,#BE68FF 12%,#382CFF 94%);
  --c-barter:linear-gradient(135deg,#C3CAD6,#20232B);
  --font:"Discovery_Fs","Heebo",Arial,sans-serif;
  --r-card:24px; --r-ctl:6px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
/* digits stay as tight as the text around them (Discovery's tabular figures run wide) */
.num{font-variant-numeric:proportional-nums;letter-spacing:-.01em}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.site-head{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.site-head .in{max-width:1440px;margin:0 auto;padding:0 52px;height:88px;display:flex;align-items:center;gap:40px}
.logo{font-weight:800;font-size:31px;letter-spacing:-.5px;line-height:1}
.mainnav{display:flex;gap:24px;color:var(--muted);font-size:17px;flex-wrap:wrap}
.mainnav a{text-decoration:none}
.mainnav a.on{color:var(--violet-text);font-weight:700}
.head-tools{margin-inline-start:auto;display:flex;align-items:center;gap:22px}
.me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 14px;font-size:15px;font-weight:500;background:var(--card)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--c-extra)}

/* shell */
.page{max-width:1140px;margin:0 auto;padding-block:56px 120px;padding-inline:16px}
.hello{font-size:16px;color:var(--muted);margin:0 4px 14px;display:inline-block}
.hello b{color:var(--ink);font-weight:500}
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);background:var(--card);border-radius:var(--r-card);min-height:780px;overflow:hidden}
.side{border-inline-end:1px solid var(--line);padding-top:58px;display:flex;flex-direction:column}
.side button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;height:54px;padding-inline:52px 20px;margin-bottom:40px;font-weight:700;font-size:19px;position:relative;transition:color .15s}
.side button:hover{color:var(--violet-text)}
.side button[aria-current="page"]{background:var(--soft);color:var(--violet-text)}
.side button[aria-current="page"]::after{content:"";position:absolute;inset-inline-end:0;top:0;bottom:0;width:3px;background:var(--violet)}
.side .sep{flex:1}
.side .logout{font-weight:500;font-size:16px;color:var(--muted);margin-bottom:28px;display:flex;align-items:center;gap:8px}
.side .logout .icon{width:20px;height:20px;flex:none}
.side .logout:hover{color:var(--ink)}
.main{padding:68px 64px 64px;min-width:0}
/* motion: one easing for everything, soft and short */
:root{--ease:cubic-bezier(.22,.61,.36,1)}
.main.enter{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{opacity:0;transform:translateY(-8px);clip-path:inset(0 0 100% 0 round 10px)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 10px)}}
@keyframes drawerOut{from{opacity:1;clip-path:inset(0 0 0 0 round 10px)}to{opacity:0;transform:translateY(-6px);clip-path:inset(0 0 100% 0 round 10px)}}
@keyframes rowIn{from{background:#EEE9FF}to{background:transparent}}
.drawer.opening .box{animation:drawerIn .5s var(--ease) both}
.drawer.closing .box{animation:drawerOut .28s ease forwards}
.fresh td{animation:rowIn 1.8s ease}
.btn,.ibtn,.dl,.side button,.tabs button,.chip{transition:background-color .25s var(--ease),color .25s var(--ease),filter .25s var(--ease),transform .15s var(--ease),box-shadow .25s var(--ease)}
.tabs button::after{transition:opacity .3s var(--ease)}
.h1{font-size:27px;font-weight:800;margin:0;line-height:1.2}
.sub{font-size:15px;margin:4px 0 0;color:var(--muted)}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:40px}

/* tabs */
.tabs{display:flex;border-bottom:1.5px solid #BDBDBD;margin-bottom:26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.fontpick{position:relative}
.fp-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:40px;background:var(--card);border-radius:var(--r-ctl);padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px}
.fp-btn:focus-visible{outline:2px solid var(--violet)}
.fp-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-menu{position:absolute;top:100%;inset-inline:0;margin-top:4px;background:var(--card);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:8px;z-index:6;min-width:200px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top center;transition:opacity .25s var(--ease),transform .3s var(--ease),visibility 0s linear .3s}
.fp-menu.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.fp-btn svg{transition:transform .3s var(--ease)}
.fp-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.fp-menu label{display:flex!important;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:15px!important;margin:0!important;cursor:pointer;white-space:nowrap;line-height:1.3}
.fp-menu label:hover{background:var(--soft)}
.fp-menu label.off{opacity:.4;cursor:not-allowed}
/* checkbox list: hold its size against theme/Elementor checkbox styles, scroll when the font list is long */
.fp-menu{max-height:min(320px,50vh);overflow-y:auto;overscroll-behavior:contain}
.fp-menu input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;accent-color:var(--violet);width:16px!important;height:16px!important;min-width:16px;max-width:16px;margin:0!important;padding:0!important;border:0;box-shadow:none;flex:none;transform:none}
.fp-hint{margin:6px 10px 2px;font-size:12px;color:var(--muted)}
.fp-hint.max{color:var(--violet);font-weight:700}
.form-err{color:#B00000;font-size:14px;margin:-14px 0 16px}
.orow td{white-space:nowrap}
.oid{display:inline-flex;align-items:center;gap:6px;margin-inline-start:-38px}
.eye-ph{width:32px;display:inline-block}
.ibtn.eye{color:var(--muted)}
.ibtn.eye:hover,.ibtn.eye.on{color:var(--violet);background:#EEE9FF}
.odet{font-size:15px}
.odet span:first-child{display:inline-block;max-width:136px;vertical-align:bottom;overflow:hidden;text-overflow:ellipsis}
.orow td,.otbl thead th{padding-inline:10px}
.otbl thead th:first-child{padding-inline-start:40px}
.orow .btn{height:34px;padding:0 12px;font-size:15px}
.orow td:first-child{padding-inline-start:40px}
.odet .more{margin-inline-start:6px;font-size:12px;font-weight:700;background:var(--soft);border-radius:99px;padding:1px 7px;color:var(--muted)}
@media (max-width:760px){.oid{margin:0}.orow td{white-space:normal}
  /* orders: date · item · status stay on one line; the item name gives way (ellipsis) */
  .orow>td.odet{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;display:flex!important;align-items:center}
  .orow>td.odet span:first-child{max-width:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .orow>td.odet .more{flex:none}
  .orow>td:nth-child(4){flex:none}
  /* profile (and any) tab bar: all tabs fit the width, no hidden tabs */
  .tabs[role=tablist] button{flex:1 1 0;min-width:0;padding:10px 4px 12px;text-align:center;white-space:normal;line-height:1.25;font-size:15px}
  /* weight picker: same size as the format buttons, on the same line; short label */
  .dl-tbl tbody tr>td.wsel-td{margin-inline-start:auto!important}
  .dl-tbl tbody tr:not(.zip-row)>td:nth-child(2){display:none}
  .dl-tbl tbody tr:not(.zip-row){column-gap:8px}
  .dl-tbl .wsel-menu{inset-inline-end:0;inset-inline-start:auto}
  .dl-tbl .wsel{width:auto;height:32px;padding:0 10px;gap:6px;font-size:13px}
  .dl-tbl .wsel .wsel-l{display:none}
  .dl-tbl .wsel .wsel-s{display:inline}
  /* ZIP buttons side by side */
  .tbl tbody tr.zip-row{flex-wrap:nowrap;gap:8px}
  .tbl tbody tr.zip-row>td:empty{display:none}
  .tbl tbody tr.zip-row>td{flex:1 1 0;min-width:0;margin:0!important}
  .tbl tbody tr.zip-row>td:last-child:empty{display:none}
  .tbl tbody tr.zip-row .btn-line{width:100%;padding:0 8px;font-size:13px;gap:6px}
}
.demo{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);background:var(--soft);border-radius:99px;padding:3px;margin-bottom:18px}
.demo span{padding:0 8px}
.demo button{all:unset;cursor:pointer;padding:3px 12px;border-radius:99px;font-weight:700;color:var(--ink)}
.demo button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dom-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.usage{display:flex;flex-direction:column;gap:6px;min-width:200px;font-size:14px}
.usage .track{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;display:block}
.usage .track i{display:block;height:100%;border-radius:9px;margin-inline-start:auto}
.ltag{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.src.buy{border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.tabs button{all:unset;cursor:pointer;padding:10px 22px 12px;font-weight:700;font-size:16px;position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;inset-inline:0;bottom:-1.5px;height:2px;background:linear-gradient(90deg,var(--violet),#B06BFF)}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl thead th{background:var(--soft);font-weight:700;font-size:16px;text-align:start;padding:12px 16px;height:44px;white-space:nowrap}
.tbl thead th:first-child{border-start-start-radius:8px;border-end-start-radius:8px;padding-inline-start:40px}
.tbl thead th:last-child{border-start-end-radius:8px;border-end-end-radius:8px}
.tbl tbody td{padding:14px 16px;font-size:16px;vertical-align:middle}
.tbl tbody td:first-child{padding-inline-start:40px;font-weight:700}
.tbl tbody tr:first-child td{padding-top:30px}
.tbl tbody tr:not(.drawer):hover td{background:#FBFAFE}
.tbl .sm{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tbl-wrap{overflow-x:auto}
.acts{display:flex;gap:14px;justify-content:flex-end;align-items:center}
.ibtn{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px}
.ibtn:hover{background:var(--soft)}
.sublogo{width:22px;height:22px;vertical-align:-6px;margin-inline-start:6px}

/* buttons */
.btn{border:0;border-radius:var(--r-ctl);height:38px;padding:0 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-grad{background:var(--grad);color:var(--ink)}
.btn-grad:hover{filter:saturate(1.3)}
.btn-ghost{background:var(--card);border:1px solid var(--ink)}
.btn-soft{background:var(--soft)}
/* download buttons share one look: small, grey hairline frame, soft grey on hover (same as .btn.dl-sm) */
.dl{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:132px;max-width:100%;height:32px;border:1px solid #D6D6D6;border-radius:8px;color:var(--ink);transition:background-color .25s var(--ease),border-color .25s var(--ease)}
.dl .icon{width:18px;height:18px}
.dl:hover{background:var(--soft);border-color:#BDBDBD}
.dl .dl-k{display:none}
.btn.btn-line{width:132px;max-width:100%;height:32px;padding:0 14px;font-size:14px;background:transparent;border:1px solid #D6D6D6;border-radius:8px;color:var(--ink)}
.btn.btn-line .icon{width:18px;height:18px}
.btn.btn-line:hover{background:var(--soft);border-color:#BDBDBD}

/* plan strip */
.plan{display:flex;align-items:center;gap:20px;background:var(--softer);border-radius:10px;padding:18px 28px;position:relative;margin-bottom:36px;flex-wrap:wrap}
.plan::after{content:"";position:absolute;inset-inline-end:0;top:0;bottom:0;width:14px;border-start-end-radius:10px;border-end-end-radius:10px;background:var(--c-extra)}
.plan img{width:52px;height:52px}
.plan .name{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center}
.plan .dates{margin-inline-start:auto;display:flex;gap:32px;font-size:14px;padding-inline-end:22px;white-space:nowrap}
@media (max-width:1000px){.plan .dates{flex-wrap:wrap;white-space:normal;margin-inline-start:0}}
.plan .dates b{display:block;font-size:14px}
/* subscription box: next payment always visible; start date + payment method fold out under "פרטים" */
.plan{padding-block:14px;row-gap:0}
.plan img{width:46px;height:46px}
.plan-desc{font-size:15px}
.plan .dates{align-items:center}
.plan-tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--violet);padding:6px 10px;border-radius:99px;transition:background-color .25s var(--ease)}
.plan-tg:hover{background:#EEE9FF}
.plan-tg:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.plan-tg .icon{width:16px;height:16px;transition:transform .5s var(--ease)}
.plan.open .plan-tg .icon{transform:rotate(180deg)}
.plan-more{flex-basis:100%;display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.plan-more>div{overflow:hidden;min-height:0}
.plan.open .plan-more{grid-template-rows:1fr}
.plan-more-in{display:flex;flex-wrap:wrap;gap:12px 40px;padding-top:14px;margin-top:14px;border-top:1px solid #E6E3F0;font-size:14px;opacity:0;transform:translateY(-4px);transition:opacity .3s ease,transform .4s var(--ease)}
.plan.open .plan-more-in{opacity:1;transform:none;transition:opacity .45s ease .1s,transform .5s var(--ease) .05s}
.plan-more-in b{display:block;font-weight:500;color:var(--muted);font-size:13px}
.plan-more-in span{font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;background:#E9E3FF;color:var(--violet);white-space:nowrap}
.chip.ok{background:var(--ok-track);color:#1E7A00}
.chip.wait{background:var(--soft);color:var(--muted)}
.chip.bad{background:var(--bad-track);color:#B00000}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* meter */
.meter{display:flex;align-items:center;gap:8px;font-size:12px}
.meter .bar{width:64px;height:5px;border-radius:9px;position:relative;background:var(--ok-track)}
.meter .bar i{position:absolute;inset-block:0;inset-inline-end:0;border-radius:9px;background:var(--ok)}
.meter.warn .bar{background:var(--warn-track)} .meter.warn .bar i{background:var(--warn)}
.meter.bad .bar{background:var(--bad-track)} .meter.bad .bar i{background:var(--bad)}

/* drawer */
.drawer>td{padding:0 0 18px!important}
.drawer .box{background:var(--bg);border-radius:10px;padding:24px 26px}
.form-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end;margin-bottom:26px}
.fld label{display:block;font-size:12px;margin-bottom:4px}
.fld input,.fld select{width:100%;height:40px;border:0;border-radius:var(--r-ctl);background:var(--card);padding:0 14px;font-size:15px}
.fld input::placeholder{color:var(--faint)}
.mini{width:100%;border-collapse:collapse;font-size:15px}
.mini th{font-weight:500;text-align:start;padding:8px 14px;border-bottom:1px solid #8C8C8C}
.mini td{padding:11px 14px}
.quota{text-align:center;margin-bottom:22px}
.quota b{display:block;font-size:17px;margin-bottom:12px}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:start}
.qopt{background:var(--card);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent}
.qopt.rec{border-color:var(--violet)}
.qopt h4{margin:0;font-size:16px}
.qopt p{margin:0;font-size:14px;color:var(--muted)}
.qopt .btn{margin-top:auto;height:34px}

/* profile form */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px}
.pf label{display:block;font-size:16px;margin-bottom:4px}
.pf input{width:100%;height:40px;border:0;border-radius:var(--r-ctl);background:var(--soft);padding:0 14px;font-size:16px}
.hint{font-size:13px;margin-top:4px;color:var(--muted)}
.prefs{display:grid;gap:4px;max-width:640px}
.pref{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.pref div{flex:1}
.pref b{display:block;font-weight:700}
.pref span{font-size:14px;color:var(--muted)}
.pf .pref{display:flex;margin:0;cursor:pointer}
.pf input.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;min-width:42px;padding:0;border:0;margin:0;border-radius:99px;background:#D6D6D6;position:relative;cursor:pointer;transition:background .2s;flex:none}
.pf input.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:right .2s}
.pf input.sw:checked{background:var(--violet)}
.pf input.sw:checked::after{right:21px}

/* certificate modal */
.modal{position:fixed;inset:0;background:rgba(20,20,30,.45);display:grid;place-items:center;padding:16px;z-index:30;opacity:0;transition:opacity .35s var(--ease)}
.modal.show{opacity:1}
.modal .sheet{transform:translateY(16px) scale(.985);transition:transform .45s var(--ease)}
.modal.show .sheet{transform:none}
.modal[hidden]{display:none!important}
.sheet{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-bar{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.cert{margin:18px;border:1.5px solid var(--ink);aspect-ratio:210/297;display:flex;flex-direction:column;font-size:14px}
.cert-head{background:#F6F1FF;border-bottom:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:16px;padding:22px 18px}
.cert-head h2{margin:0;font-size:27px;font-weight:800}
.cert-head img{width:54px;height:54px}
.cert-body{padding:22px 30px;display:flex;flex-direction:column;gap:16px;flex:1}
.cert-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cert-row .who b{display:block;font-size:21px}
.cert dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px}
.cert dt{font-weight:700} .cert dd{margin:0}
.cert-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.seal{width:84px;height:84px;display:block}

/* floating cart for the ₪79 add-on: pay without leaving the page, then straight back to registering the domain.
   Desktop: sheet from the left edge. Phones: bottom sheet. */
.cart{position:fixed;inset:0;z-index:35;background:rgba(20,20,30,.4);opacity:0;transition:opacity .3s var(--ease)}
.cart.show{opacity:1}
.cart[hidden]{display:none!important}

/* weight names for a family (sample data: spread over the usual scale) */
const WEIGHTS=['Thin','ExtraLight','Light','Regular','Medium','Demibold','Bold','ExtraBold','Black'];
const weightsOf=n=>n>=WEIGHTS.length?WEIGHTS.slice():[...new Set(Array.from({length:n},(_,i)=>WEIGHTS[Math.round(i*(WEIGHTS.length-1)/Math.max(1,n-1))]))];
function weightPick(f,n){
 return `<div class="pop wsel-pop"><button class="wsel" data-pop="1" aria-haspopup="true" aria-expanded="false" aria-label="בחירת משקל להורדה מ${f}"><span class="wsel-l">בחירת משקל</span><span class="wsel-s">משקל</span> ${ICON.chev}</button>
  <div class="pop-menu wsel-menu" role="menu">${weightsOf(n).map(w=>`<button role="menuitem" data-t="מוריד את ${f} ${w}"><span dir="ltr">${w}</span>${ICON.dl}</button>`).join('')}</div></div>`;
}
function subsDownloads(){
 return `<div class="tbl-wrap lic-wrap"><table class="tbl dl-tbl"><thead><tr><th>שם הפונט</th><th>משקלים</th><th>פורמט לאתרים</th><th>פורמט לדסקטופ</th><th>הורדה לפי משקל</th></tr></thead><tbody>

 <td><button class="dl" aria-label="הורדת ${f} לדסקטופ" data-t="מוריד את ${f} לדסקטופ (OTF)">${ICON.dl}<span class="dl-k">דסקטופ</span></button></td>

/* פונטים שרכשתי: one list, one row per purchased license. Download + certificate on every row;
   web licenses also show their own domain counter and open a drawer to register. No tabs. */
V.lic=(tab,open)=>`
 <div class="head-row"><div><h1 class="h1">פונטים שרכשתי</h1><p class="sub">פונטים שקנית בנפרד, מחוץ למינוי. רישיון וובפונט מכסה עד 3 אתרים.</p></div></div>
 ${licTable(open)}`;

/* one row per font + weight. Every purchased licence stays its own record (own certificate, own files);
   the row only groups them: all licence names as tags, certificate/download offer a choice when there is more than one */
function licGroups(){const g=new Map();LIC.forEach((l,i)=>{const k=l.f+'|'+l.w;if(!g.has(k))g.set(k,[]);g.get(k).push(i)});return [...g.values()]}
const FMT={'וובפונט':'לאתרים (WOFF2)','דסקטופ':'לדסקטופ (OTF)','אפליקציה':'לאפליקציה'};
function choice(icon,label,cls,items){
 if(items.length===1)return items[0].replace('%B',`class="${cls}" aria-label="${label}" title="${label}"`).replace('%I',icon);
 return `<div class="pop"><button class="${cls}" data-pop="1" aria-haspopup="true" aria-expanded="false" aria-label="${label}" title="${label}">${icon}</button><div class="pop-menu" role="menu">${items.map(x=>x.replace('%B','role="menuitem"').replace('%I','')).join('')}</div></div>`;
}
function licTable(open){
 const hasSites=LIC.some(l=>l.web),cols=hasSites?5:4;
 return `<div class="tbl-wrap lic-wrap"><table class="tbl"><thead><tr><th>שם הפונט</th><th>משקל</th><th>רישיון</th>${hasSites?'<th>ניצול אתרים</th>':''}<th></th></tr></thead><tbody>
 ${licGroups().map(ids=>{const L=ids.map(i=>LIC[i]),l=L[0],wi=ids.find(i=>LIC[i].web),w=wi===undefined?null:LIC[wi],isOpen=w&&open===wi,full=w&&w.u>=w.n;
 const types=[...new Set(L.flatMap(x=>x.t.split(' + ')))];
 const certs=ids.map(i=>`<button %B data-cert="lic:${i}">%I${ids.length>1?`תעודת ${LIC[i].t}`:''}</button>`);
 const dls=ids.flatMap(i=>LIC[i].t.split(' + ').map(t=>`<button %B data-t="מוריד את ${l.f} ${l.w} ${FMT[t]||''}">%I${ids.length>1||LIC[i].t.includes('+')?`הורדה ${FMT[t]||t}`:''}</button>`));
 return `<tr class="${isOpen?'is-open':''}">
 <td><span class="fname">${w?`<button class="ibtn exp" data-open="${wi}" aria-expanded="${isOpen}" aria-label="${isOpen?'סגירת':'פתיחת'} רישום האתרים של ${l.f}" title="${isOpen?'סגירה':'רישום אתרים'}">${ICON.globe}</button>`:'<span class="exp-ph"></span>'}${l.f}</span></td>
 <td>${l.w}</td><td>${types.map(x=>`<span class="ltag">${x}</span>`).join(' ')}</td>
 ${hasSites?`<td>${w?meter(w.u,w.n):''}</td>`:''}
 <td><div class="acts">
   ${choice(ICON.cert,'תעודת רישיון','ibtn',certs)}
   ${choice(ICON.dl,`הורדת ${l.f} ${l.w}`,'btn dl-sm',dls)}</div></td></tr>
 ${isOpen?licDrawer(wi,cols,full):''}`}).join('')}
 </tbody></table></div>`;
}
function licDrawer(i,cols,full){const l=LIC[i];
 return `<tr class="drawer"><td colspan="${cols}"><div class="lic-drawer"><div class="box dom-box">
   ${full?quotaFull(l):`
   <form class="form-row lic-form" data-add="${i}">
     <div class="fld"><label for="su${i}">כתובת האתר *</label><input id="su${i}" data-namefor="sn${i}" placeholder="fontshok.co.il" dir="ltr" inputmode="url" autocomplete="off" required></div>
     <div class="fld"><label for="sn${i}">שם האתר <span style="color:var(--muted)">(רשות)</span></label><input id="sn${i}" class="sitename" placeholder="יתמלא אוטומטית מהכתובת"></div>
     <button class="btn btn-grad" style="height:40px">רישום אתר</button>
   </form>`}
   </div>
   <table class="mini lined"><thead><tr><th>תאריך</th><th>שם האתר</th><th>כתובת אתר</th><th></th></tr></thead><tbody>
   ${l.sites.map((s,j)=>state.editKey===`dom:${i}:${j}`
     ?`<tr class="editing" data-key="dom:${i}:${j}"><td class="num">${s[0]}</td>${editCells(s[1],s[2])}<td>${editBtns()}</td></tr>`
     :`<tr><td class="num">${s[0]}</td><td>${s[1]}</td><td><bdi dir="ltr">${s[2]}</bdi></td>
   <td>${rowActs(`dom:${i}:${j}`,s[0],`dom:${i}:${j}`,`data-del="${i}:${j}"`)}</td></tr>`).join('')}
   </tbody></table></div></td></tr>`;
}
function quotaFull(l){
 return `<div class="quota-line">
  <div class="msg"><b>כל ${l.n} האתרים של הרישיון רשומים</b><span>צריך עוד אתר? אפשר להוסיף אחד בתשלום חד־פעמי.</span></div>

/* דומיינים: read-only overview of every site, whatever it came through. Registering happens in "המינוי שלי" or "פונטים שרכשתי". */
V.dom=()=>{
 const p=PLAN[state.plan];
 const fromSub=SUBDOM[state.plan].map((s,j)=>({s,src:`<span class="src sub">${logo(state.plan)}מינוי ${p.label}</span>`,font:s[3],cert:`sd:${j}`,del:`data-sddel="${j}"`}));
 const fromLic=LIC.map((l,i)=>l.web?l.sites.map((s,j)=>({s,src:`<span class="src buy">רכישה</span>`,font:`${l.f} ${l.w}`,cert:`dom:${i}:${j}`,del:`data-del="${i}:${j}"`})):[]).flat();
 const all=[...fromSub,...fromLic].sort((a,b)=>parseD(b.s[0])-parseD(a.s[0]));
 const now=all.filter(r=>canEdit(r.s[0])),past=all.filter(r=>!canEdit(r.s[0]));
 const row=r=>state.editKey===r.cert
   ?`<tr class="editing" data-key="${r.cert}"><td><div class="ed-pair stacked">${editHost(r.s[1],r.s[2])}</div></td><td>${r.cert.startsWith('sd:')?fontPicker(r.font.split(', ').filter(Boolean)):r.font}</td><td>${r.src}</td><td class="num">${r.s[0]}</td><td>${editBtns()}</td></tr>`
   :`<tr><td><bdi dir="ltr">${r.s[2]}</bdi><span class="sm">${r.s[1]}</span></td><td>${r.font}</td><td>${r.src}</td><td class="num">${r.s[0]}</td>
 <td>${rowActs(r.cert,r.s[0],r.cert,r.del)}</td></tr>`;
 /* history grouped by month, newest first */
 let last='';const hist=past.map(r=>{const d=parseD(r.s[0]),k=`${MONTHS[d.getMonth()]} ${d.getFullYear()}`;const h=k!==last?`<tr class="mgroup"><td colspan="5">${k}</td></tr>`:'';last=k;return h+row(r)}).join('');
 const thead=`<thead><tr><th>דומיין</th><th>פונטים</th><th>דרך</th><th>תאריך רישום</th><th></th></tr></thead>`;
 return `
 <div class="head-row"><div><h1 class="h1">דומיינים</h1><p class="sub">כל האתרים שלך במקום אחד. רישום אתר חדש נעשה במינוי או בפונט שרכשת.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-grad" data-go2="subs">רישום אתר במינוי</button></div></div>
 <h2 class="h2-sec">החודש · ${CYCLE.label} 2026</h2>
 <div class="tbl-wrap"><table class="tbl">${thead}<tbody>
 ${now.map(row).join('')||`<tr><td colspan="5" class="hint">עוד לא נרשמו דומיינים החודש</td></tr>`}
 </tbody></table></div>
 <p class="hint lock-note dom-note">${ICON.lock} אפשר לערוך או להסיר עד סוף ${CYCLE.label}. דומיין שהוסר או שונה לא נשמר בהיסטוריה.</p>
 <button class="hist-toggle" data-hist="1" aria-expanded="${!!state.histOpen}" aria-controls="histBody">${ICON.chev}<span class="h2-sec" style="margin:0">היסטוריית דומיינים <span class="hint" style="margin:0;font-weight:400">${past.length} דומיינים</span></span></button>
 <div class="hist-body ${state.histOpen?'open':''}" id="histBody"><div><div class="tbl-wrap hist-scroll"><table class="tbl">${thead}<tbody>${hist}</tbody></table></div></div></div>`;
};

   <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-grad" data-t="מוריד חשבונית #${o.id}">${ICON.dl} הורדת חשבונית</button></div>

/* state & router */
let state={view:'subs',plan:'web',sub:{subs:'dl',lic:'list',profile:'me'},open:{lic:-1,orders:0}};
try{const s=JSON.parse(localStorage.getItem('fs-acc3')||'null');if(s&&V[s.view])state=Object.assign(state,s)}catch(e){}
{const hv=location.hash.slice(1);if(V[hv])state.view=hv;if(hv==='cert')setTimeout(()=>openCert('sd:0'),50);if(hv==='quota'){state.view='lic';state.open.lic=2}if(hv==='subdom'){state.view='subs';state.sub.subs='reg'}}
/* back from paying for an add-on on the live site (WooCommerce return URL): reopen the matching registration form */
{const q=new URLSearchParams(location.search);if(q.get('fs_addon')==='paid'){const lic=q.get('kind')==='lic';
 if(lic){state.view='lic';state.open.lic=+q.get('licence')||0}else{state.view='subs';state.sub.subs='reg'}
 history.replaceState(null,'',location.pathname+location.hash);
 setTimeout(()=>backTo(lic?'#su'+state.open.lic:'#sd2','התשלום התקבל. אפשר לרשום את '+(lic?'האתר':'הדומיין')+' הנוסף'),300)}}
function save(){try{localStorage.setItem('fs-acc3',JSON.stringify(state))}catch(e){}}
/* "https://www.studio-dayan.co.il/about" -> host "studio-dayan.co.il" -> name "Studio Dayan".
   On the live site the server can also fetch the page <title> for a nicer name. */
const cleanHost=v=>v.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split(/[\/?#]/)[0];
const siteName=h=>{const parts=h.split('.');const sld=['co','org','net','ac','gov','muni'];let i=parts.length-2;if(i>0&&sld.includes(parts[i]))i--;return (parts[Math.max(i,0)]||h).split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')};
const today=()=>{const d=new Date();return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`};
/* render({page}) fades the whole page in only when the page changes; {opening} lets a just-opened drawer unfold; {fresh} highlights a just-added row */
function render(o={}){
 document.querySelectorAll('.side button[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false'));
 const v=state.view,el=$('#view');
 /* phones: keep the active tab visible in the scrolling tab bar */
 const cur=document.querySelector(`.side button[data-view="${v}"]`),bar=cur&&cur.parentElement;
 if(cur&&bar.scrollWidth>bar.clientWidth)bar.scrollTo({left:cur.offsetLeft-(bar.clientWidth-cur.offsetWidth)/2,behavior:o.page?'auto':'smooth'});
 el.innerHTML=v==='lic'?V.lic(state.sub.lic,state.open.lic):v==='orders'?V.orders(state.open.orders):v==='subs'?V.subs(state.sub.subs):v==='profile'?V.profile(state.sub.profile):V[v]();
 el.classList.remove('enter');if(o.page){void el.offsetWidth;el.classList.add('enter')}
 if(o.opening)el.querySelectorAll('.drawer').forEach(d=>d.classList.add('opening'));
 if(o.fresh){const td=[...el.querySelectorAll('.mini td, .tbl td')].find(c=>c.textContent.trim()===o.fresh);td&&td.parentElement.classList.add('fresh')}
 save();
}
state.editKey=null;
const goPage=v=>{state.view=v;state.editKey=null;render({page:true});scrollTo({top:0,behavior:'smooth'})};
/* close the open drawer with a short fold, then re-render */
function toggleDrawer(key,i){
 const open=state.open[key]===i;const d=$('#view .drawer');
 if(open&&d){d.classList.add('closing');setTimeout(()=>{state.open[key]=-1;render()},260);return}
 state.open[key]=i;render({opening:true});
}
/* ₪79 add-on cart: pay -> processing -> paid -> "חזרה לרישום הדומיין".
   The slot is granted only when payment succeeds; closing before paying changes nothing.
   On the live site the pay step is the WooCommerce order-pay page (POST /fs/v1/account/addon), which returns here when paid. */
const cart=$('#cart');let cartItem=null;
function cartStep(it,step){
 if(step==='pay')return `<div class="cart-item"><span class="cart-ic">${ICON.globe}</span><div><b>${it.name}</b><span>${it.desc}</span></div><b class="num">${ils(it.price)}</b></div>
  <dl class="cart-sum"><dt class="tot">סה״כ לתשלום</dt><dd class="tot num">${ils(it.price)}</dd><dt class="vat">מתוכם מע״מ 18%</dt><dd class="vat num">${ils(+(it.price-it.price/1.18).toFixed(2))}</dd></dl>
  <div class="cart-pay"><span>${ICON.card} ויזה •••• 4821</span><a href="#" data-t="מעבר לעדכון כרטיס בסמית" style="font-size:13px">שינוי</a></div>
  <button class="btn btn-grad cart-go" id="cartPay">לתשלום ${ils(it.price)}</button>
  <p class="hint cart-note">תשלום חד־פעמי מאובטח. החשבונית תופיע ב״הזמנות״.</p>`;
 if(step==='wait')return `<div class="cart-wait" role="status"><span class="spin" aria-hidden="true"></span>מעבד את התשלום…</div>`;
 return `<div class="cart-ok" role="status"><span class="ok-ic">${ICON.check}</span><b>התשלום התקבל</b><span>${it.okText}</span><button class="btn btn-grad cart-go" id="cartBack">${it.backText}</button></div>`;
}
function openCart(it){cartItem=Object.assign({paid:false},it);$('#cartBody').innerHTML=cartStep(cartItem,'pay');cart.hidden=false;void cart.offsetWidth;cart.classList.add('show');$('#cartPay').focus()}
function closeCart(){if(cart.hidden||!cartItem||cartItem.busy)return;const it=cartItem;cart.classList.remove('show');setTimeout(()=>{cart.hidden=true},320);if(it.paid)it.back()}
function payCart(){const it=cartItem;it.busy=true;$('#cartBody').innerHTML=cartStep(it,'wait');
 setTimeout(()=>{it.busy=false;it.paid=true;it.grant();ORDERS.push({id:String(+ORDERS[ORDERS.length-1].id+1),d:today(),items:[[it.name,it.price]],st:'הושלם'});$('#cartBody').innerHTML=cartStep(it,'ok');$('#cartBack').focus()},1400)}
cart.addEventListener('click',e=>{if(e.target===cart)closeCart()});
/* back in the registration form, ready to type the new domain */
function backTo(sel,msg){setTimeout(()=>{const f=$(sel);if(f){f.scrollIntoView({behavior:'smooth',block:'center'});f.focus({preventScroll:true})}toast(msg)},60)}
const modal=$('#certModal');
function showModal(){modal.hidden=false;void modal.offsetWidth;setTimeout(()=>modal.classList.add('show'),16);$('#certClose').focus()}
function hideModal(){if(modal.hidden)return;modal.classList.remove('show');setTimeout(()=>{modal.hidden=true},350)}
function openCert(spec){
 const p=spec.split(':');let l,site=null;
 if(p[0]==='sd'){const s=SUBDOM[state.plan][+p[1]];l={f:s[3],w:'',t:'וובפונט',sub:state.plan,n:PLAN[state.plan].n};site=s}
 else if(p[0]==='hist'){const h=HISTORY[+p[1]];const base=LIC.find(x=>x.f===h.f&&x.w===h.w)||{};l=Object.assign({},base,{sub:h.sub,removed:h.removed});site=h.site}
 else{l=LIC[+p[1]];if(p[0]==='dom')site=l.sites[+p[2]]}
 $('#certBody').innerHTML=cert(l,site);showModal();
}
$('#certClose').onclick=hideModal;
modal.addEventListener('click',e=>{if(e.target.id==='certModal')hideModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideModal();closeMenus();closeCart()}});
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a');if(!t)return;
 if(t.dataset.view){goPage(t.dataset.view);return}
 if(t.dataset.plantg){state.planOpen=!state.planOpen;t.closest('.plan').classList.toggle('open',state.planOpen);t.setAttribute('aria-expanded',state.planOpen);save();return}
 if(t.dataset.hist){state.histOpen=!state.histOpen;t.setAttribute('aria-expanded',state.histOpen);$('#histBody').classList.toggle('open',state.histOpen);return}
 if(t.dataset.go){e.preventDefault();if(t.dataset.go==='dom')state.histOpen=true;goPage(t.dataset.go);return}
 if(t.dataset.subtab){state.sub[state.view]=t.dataset.subtab;render({page:true});return}
 if(t.dataset.open!==undefined){toggleDrawer('lic',+t.dataset.open);return}
 if(t.dataset.oopen!==undefined){toggleDrawer('orders',+t.dataset.oopen);return}
 if(t.dataset.cert){openCert(t.dataset.cert);return}
 if(t.dataset.del){const[i,j]=t.dataset.del.split(':').map(Number);const l=LIC[i];const s=l.sites.splice(j,1)[0];l.u=l.sites.length;render();toast(`${s[2]} הוסר והמקום ברישיון התפנה`);return}
 if(t.id==='cartPay'){payCart();return}
 if(t.id==='cartBack'||t.id==='cartClose'){closeCart();return}
 if(t.dataset.addon){const i=+t.dataset.addon,l=LIC[i];openCart({name:`אתר נוסף · ${l.f} ${l.w}`,desc:'מקום נוסף ברישיון הוובפונט, לצמיתות',price:79,
   okText:`ברישיון של ${l.f} יש עכשיו ${l.n+1} אתרים.`,backText:'חזרה לרישום האתר',
   grant:()=>{l.n+=1},back:()=>{state.view='lic';state.open.lic=i;render({opening:true});backTo('#su'+i,'אפשר לרשום את האתר הנוסף')}});return}
 if(t.dataset.hidenote){const n=$('.note');n.style.transition='opacity .3s var(--ease),transform .3s var(--ease)';n.style.opacity=0;n.style.transform='translateY(-4px)';setTimeout(()=>{state.noteHidden=1;render()},300);return}
 if(t.dataset.edit){state.editKey=t.dataset.edit;render();const r=$(`tr.editing`);r&&r.querySelector('.ed-host').focus();return}
 if(t.dataset.edcancel){state.editKey=null;render();return}
 if(t.dataset.edsave){saveEdit(t.closest('tr'));return}
 if(t.dataset.plan){state.plan=t.dataset.plan;render({page:true});return}
 if(t.dataset.planaddon){openCart({name:`דומיין נוסף · מינוי ${PLAN[state.plan].label}`,desc:`רישום אחד נוסף לחודש ${CYCLE.label}`,price:79,
   okText:`נוסף רישום אחד למכסת ${CYCLE.label}.`,backText:'חזרה לרישום הדומיין',
   grant:()=>{BONUS+=1},back:()=>{state.view='subs';state.sub.subs='reg';render();backTo('#sd2','אפשר לרשום את הדומיין הנוסף')}});return}
 if(t.dataset.sddel){const s=SUBDOM[state.plan].splice(+t.dataset.sddel,1)[0];render();toast(`${s[2]} הוסר והמקום במכסה התפנה`);return}
 if(t.dataset.go2){state.sub.subs='reg';goPage(t.dataset.go2);return}
 if(t.id==='logout'){toast('התנתקת. נתראה!');return}
 if(t.dataset.t){e.preventDefault();toast(t.dataset.t)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.dataset.subadd){
  const host=cleanHost($('#sd2').value),picked=[...f.querySelectorAll('.fp-menu input:checked')].map(i=>i.value),err=$('#sdErr');
  const msg=!host||!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(host)?'צריך להזין כתובת אתר תקינה, למשל studio.co.il':!picked.length?'צריך לבחור לפחות פונט אחד':'';
  if(msg){err.textContent=msg;err.hidden=false;(msg.includes('כתובת')?$('#sd2'):f.querySelector('.fp-btn')).focus();return}
  SUBDOM[state.plan].unshift([today(),$('#sd1').value.trim()||siteName(host),host,picked.join(', ')]);render({fresh:host});toast('האתר נרשם במינוי. התעודה מוכנה להורדה');return}
 if(f.dataset.add!==undefined){const l=LIC[+f.dataset.add];const host=cleanHost(f.querySelector('[data-namefor]').value);if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(host)){toast('צריך להזין כתובת אתר תקינה');return}l.sites.unshift([today(),f.querySelector('.sitename').value.trim()||siteName(host),host]);l.u=l.sites.length;render({fresh:host});toast('הדומיין נרשם. התעודה מוכנה להורדה');return}
 toast('השינויים נשמרו');
});
document.addEventListener('change',e=>{
 if(e.target.closest('.fp-menu')){const m=e.target.closest('.fp-menu'),boxes=[...m.querySelectorAll('input')],on=boxes.filter(b=>b.checked);
  boxes.forEach(b=>{b.disabled=!b.checked&&on.length>=2;b.parentElement.classList.toggle('off',b.disabled)});
  m.querySelector('.fp-hint').classList.toggle('max',on.length>=2);
  m.parentElement.querySelector('.fp-val').textContent=on.length?on.map(b=>b.value).join(', '):'בחירת פונטים';$('#sdErr')&&($('#sdErr').hidden=true)}
});
/* save an inline-edited domain row (only rows of the current cycle get here) */
function saveEdit(tr){
 const key=tr.dataset.key,host=cleanHost(tr.querySelector('.ed-host').value),name=tr.querySelector('.ed-name').value.trim()||siteName(host);
 if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(host)){toast('צריך להזין כתובת אתר תקינה');tr.querySelector('.ed-host').focus();return}
 const fonts=[...tr.querySelectorAll('.fp-menu input:checked')].map(i=>i.value);
 if(tr.querySelector('.fp-menu')&&!fonts.length){toast('צריך לבחור לפחות פונט אחד');return}
 const p=key.split(':');
 if(p[0]==='sd'){const s=SUBDOM[state.plan][+p[1]];s[1]=name;s[2]=host;s[3]=fonts.join(', ')}
 else{const s=LIC[+p[1]].sites[+p[2]];s[1]=name;s[2]=host}
 state.editKey=null;render({fresh:host});toast('הדומיין עודכן, וגם התעודה שלו');
}
document.addEventListener('keydown',e=>{const tr=e.target.closest&&e.target.closest('tr.editing');if(!tr)return;if(e.key==='Enter'){e.preventDefault();saveEdit(tr)}if(e.key==='Escape'){state.editKey=null;render()}});
function closeMenus(){document.querySelectorAll('.fp-menu.open').forEach(m=>{m.classList.remove('open');m.parentElement.querySelector('.fp-btn').setAttribute('aria-expanded','false')})}
function closePops(except){document.querySelectorAll('.pop.open').forEach(p=>{if(p!==except){p.classList.remove('open');p.querySelector('[data-pop]').setAttribute('aria-expanded','false')}})}
document.addEventListener('click',e=>{const pb=e.target.closest('[data-pop]');
 if(pb){const p=pb.parentElement;closePops(p);const o=p.classList.toggle('open');pb.setAttribute('aria-expanded',o);e.stopImmediatePropagation();return}
 closePops()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePops()});
document.addEventListener('click',e=>{const fb=e.target.closest('.fp-btn');
 if(fb){const m=fb.parentElement.querySelector('.fp-menu');const open=m.classList.toggle('open');fb.setAttribute('aria-expanded',open);return}
 if(!e.target.closest('.fp-menu'))closeMenus()});
document.addEventListener('input',e=>{if(e.target.dataset.namefor){const n=document.getElementById(e.target.dataset.namefor);const h=cleanHost(e.target.value);if(n&&!n.dataset.touched)n.value=h.includes('.')?siteName(h):''}if(e.target.classList.contains('sitename'))e.target.dataset.touched=e.target.value?'1':''});
document.addEventListener('input',e=>{if(e.target.id==='sd2'){const n=$('#sd1');const h=cleanHost(e.target.value);if(!n.dataset.touched)n.value=h.includes('.')?siteName(h):'';$('#sdErr').hidden=true}if(e.target.id==='sd1')e.target.dataset.touched=e.target.value?'1':''});
document.addEventListener('input',e=>{if(e.target.id==='oq'){const q=e.target.value.trim().replace('#','');document.querySelectorAll('#otb tr[data-oid]').forEach(r=>r.hidden=q&&!r.dataset.oid.includes(q))}});
const sn=$('#showNew');sn.addEventListener('change',()=>document.body.classList.toggle('show-new',sn.checked));
const h=new Date().getHours();$('#greet').textContent=h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב';
document.querySelectorAll('i[data-ic]').forEach(e=>{const w=document.createElement('span');w.className='ic-wrap '+(e.className||'');if(e.title)w.title=e.title;w.innerHTML=ICON[e.dataset.ic];e.replaceWith(w)});
render({page:true});
/* smiley says hello once on load, and again on tap (phones have no hover) */
const smiley=$('.smiley');const smile=()=>{smiley.classList.remove('play');void smiley.offsetWidth;smiley.classList.add('play');clearTimeout(smiley._t);smiley._t=setTimeout(()=>smiley.classList.remove('play'),1500)};
setTimeout(smile,700);$('.hello').addEventListener('click',smile);
</script>
