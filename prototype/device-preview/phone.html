<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תצוגת מכשירים פונטשוק</title>
<style>
:root{--bg:#ECECEF;--panel:#FFFFFF;--ink:#151515;--muted:#6E6E6E;--line:#DCDCE2;--bezel:#1B1B1F;--accent:#5B3FFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--panel:#1D1D21;--ink:#F2F2F4;--muted:#A0A0A8;--line:#33333A;--bezel:#000;--accent:#9B86FF}}
:root[data-theme="dark"]{--bg:#121214;--panel:#1D1D21;--ink:#F2F2F4;--muted:#A0A0A8;--line:#33333A;--bezel:#000;--accent:#9B86FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:14px 16px 6px;width:100%}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:99px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 8px}
.stage{flex:1;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:8px 16px 24px;overflow:hidden}
.phone{flex:none}
.phone{background:var(--bezel);border-radius:52px;padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.25);transform-origin:top center;position:relative}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
.screen{border-radius:40px;overflow:hidden;background:#fff;display:block}
/* status bar strip, so the notch never covers the page (like a real phone) */
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:600 14px system-ui,-apple-system,sans-serif;color:#000;background:#fff;direction:ltr}
iframe{border:0;display:block;background:#F4F4F4}
/* desktop: a plain browser window, scaled down to fit */
.phone.desk{border-radius:14px;padding:0;background:var(--bezel)}
.phone.desk::before{display:none}
.phone.desk .screen{border-radius:0 0 14px 14px}
.phone.desk .status{display:none}
.chrome{display:none;height:34px;align-items:center;gap:7px;padding:0 14px;background:#2A2A30;border-radius:14px 14px 0 0;direction:ltr}
.chrome i{width:11px;height:11px;border-radius:50%;background:#FF5F57}.chrome i+i{background:#FEBC2E}.chrome i+i+i{background:#28C840}
.chrome span{margin-left:14px;flex:1;max-width:420px;height:20px;border-radius:6px;background:#3A3A42;color:#B8B8C0;font:12px/20px system-ui,sans-serif;padding:0 10px;overflow:hidden;white-space:nowrap}
.phone.desk .chrome{display:flex}
/* on an actual phone: no frame, the page fills the screen */
@media (max-width:520px){
  .stage{padding:0}
  .phone{background:none;border-radius:0;padding:0;box-shadow:none;transform:none!important}
  .phone::before{display:none}
  .screen{border-radius:0}
  .status{display:none}
}
</style>
</head>
<body>
<div class="bar">
  <div class="seg" role="group" aria-label="עמוד">
    <button data-page="app/account.html" aria-pressed="true">אזור אישי</button>
    <button data-page="app/plans.html" aria-pressed="false">תוכניות מינוי</button>
  </div>
  <div class="seg" role="group" aria-label="מכשיר">
    <button data-dev="375x667" aria-pressed="false">iPhone SE</button>
    <button data-dev="390x844" aria-pressed="true">iPhone 14</button>
    <button data-dev="430x932" aria-pressed="false">Pro Max</button>
    <button data-dev="1440x900" aria-pressed="false">דסקטופ</button>
  </div>
  <button class="tool" id="reset" title="מחזיר את הנתונים לדוגמה למצב ההתחלתי">איפוס</button>
</div>
<p class="hint" id="hint">לוחצים וגוללים בתוך המסך כמו במכשיר אמיתי. בדסקטופ התצוגה מוקטנת כדי להיכנס בחלון. הנתונים לדוגמה בלבד.</p>
<div class="stage" id="stage">
  <div class="phone" id="phone"><div class="chrome"><i></i><i></i><i></i><span>fontshok.co.il/my-account-new/</span></div><div class="screen"><div class="status"><span>9:41</span><span>●●● ▮</span></div><iframe id="fr" title="תצוגת טלפון" src="app/account.html"></iframe></div></div>
</div>
<script>
const fr=document.getElementById('fr'),phone=document.getElementById('phone'),stage=document.getElementById('stage');
let dev=[390,844];
try{const s=JSON.parse(localStorage.getItem('fs-phone')||'null');if(s&&s.dev)dev=s.dev;if(s&&s.page)fr.src=s.page}catch(e){}
function mark(attr,val){document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===val))}
function fit(){
  const desk=dev[0]>=1000,small=innerWidth<=520&&!desk;
  phone.classList.toggle('desk',desk);
  fr.style.width=small?innerWidth+'px':dev[0]+'px';
  fr.style.height=small?(innerHeight-stage.getBoundingClientRect().top)+'px':(dev[1]-(desk?0:44))+'px';
  if(small){phone.style.transform='';phone.style.marginBottom='';return}
  /* scale to fit both the height and the width of the window */
  const availH=innerHeight-stage.getBoundingClientRect().top-32,availW=innerWidth-32,fullH=dev[1]+(desk?34:28),fullW=dev[0]+(desk?0:28);
  const k=Math.min(1,availH/fullH,availW/fullW);phone.style.transform=`scale(${k})`;phone.style.marginBottom=`${-(1-k)*fullH}px`;
  phone.style.marginInline=`${-(1-k)*fullW/2}px`;
}
function save(){try{localStorage.setItem('fs-phone',JSON.stringify({dev,page:fr.getAttribute('src')}))}catch(e){}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{fr.src=b.dataset.page;mark('page',b.dataset.page);save()});
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{dev=b.dataset.dev.split('x').map(Number);mark('dev',b.dataset.dev);fit();save()});
document.getElementById('reset').onclick=()=>{try{fr.contentWindow.localStorage.removeItem('fs-acc3')}catch(e){}fr.src=fr.getAttribute('src')};
mark('page',fr.getAttribute('src'));mark('dev',dev.join('x'));
addEventListener('resize',fit);fit();
</script>
</body>
</html>
